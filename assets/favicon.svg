<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B26" />
      <stop offset="100%" stop-color="#0A0D14" />
    </linearGradient>

    <!-- Red Neon Tally (Live) -->
    <linearGradient id="redTally" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF453A" />
      <stop offset="100%" stop-color="#D70015" />
    </linearGradient>
    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Electric Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#0062CC" />
    </linearGradient>
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Preview Green Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#32D74B" />
      <stop offset="100%" stop-color="#248A3D" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base App Icon Tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6" />

  <!-- Deck Grid Elements (3x2 Buttons Array) -->
  <!-- Top Left: Live Scene Button with Red Glow -->
  <rect x="76" y="86" width="160" height="136" rx="24" fill="#1C2230" stroke="#FF3B30" stroke-width="4" filter="url(#redGlow)"/>
  <circle cx="112" cy="122" r="10" fill="#FF3B30" />
  <rect x="134" y="115" width="76" height="14" rx="7" fill="#FF3B30" opacity="0.9"/>
  <!-- Sound Wave / Mini VU on Live Pad -->
  <rect x="100" y="160" width="8" height="34" rx="4" fill="#32D74B"/>
  <rect x="116" y="150" width="8" height="44" rx="4" fill="#32D74B"/>
  <rect x="132" y="142" width="8" height="52" rx="4" fill="#FFD60A"/>
  <rect x="148" y="154" width="8" height="40" rx="4" fill="#32D74B"/>
  <rect x="164" y="136" width="8" height="58" rx="4" fill="#FF453A"/>

  <!-- Top Right: Preview Scene Button with Green Accent -->
  <rect x="276" y="86" width="160" height="136" rx="24" fill="#161C26" stroke="#32D74B" stroke-width="3"/>
  <circle cx="312" cy="122" r="8" fill="#32D74B" />
  <rect x="332" y="116" width="70" height="12" rx="6" fill="#8E8E93" opacity="0.6"/>
  <!-- Cut / Transition Icon -->
  <path d="M336 156 L376 178 L336 200 Z" fill="#32D74B" opacity="0.85"/>

  <!-- Bottom Left: Macro Deck Pad with Blue Spark -->
  <rect x="76" y="262" width="160" height="164" rx="24" fill="#161C26" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3"/>
  <circle cx="156" cy="326" r="32" fill="none" stroke="#0A84FF" stroke-width="5" filter="url(#blueGlow)"/>
  <path d="M156 310 L156 342 M140 326 L172 326" stroke="#0A84FF" stroke-width="5" stroke-linecap="round"/>
  <rect x="108" y="380" width="96" height="12" rx="6" fill="#8E8E93" opacity="0.5"/>

  <!-- Bottom Right: Audio Master Fader -->
  <rect x="276" y="262" width="160" height="164" rx="24" fill="#161C26" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3"/>
  <!-- Fader Track -->
  <rect x="350" y="286" width="12" height="116" rx="6" fill="#0A0D14"/>
  <rect x="350" y="336" width="12" height="66" rx="6" fill="#0A84FF"/>
  <!-- Fader Knob -->
  <rect x="328" y="324" width="56" height="24" rx="7" fill="#F2F2F7" filter="url(#blueGlow)"/>
  <line x1="338" y1="336" x2="374" y2="336" stroke="#1C2230" stroke-width="3" stroke-linecap="round"/>

  <!-- Central Cue Deck Badge Line -->
  <circle cx="256" cy="242" r="16" fill="#FF3B30" filter="url(#redGlow)"/>
</svg>
